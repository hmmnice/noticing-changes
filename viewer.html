<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Changed</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --ink:#e8eaee; --dim:#9aa1ad; --line:#2a2f3a;
          --removed:#e63c3c; --added:#3cc85a; --moved-a:#f09628; --moved-b:#4682f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif;
         display:grid; grid-template-columns: 1fr 380px; height:100vh; overflow:hidden; }
  #view { position:relative; min-width:0; }
  canvas { display:block; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:16px; }
  h1 { font-size:17px; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; word-break:break-all; }
  .ctl { display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0 14px; color:var(--dim); font-size:13px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--dim); margin-bottom:14px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; cursor:pointer; }
  .card:hover, .card.on { border-color:#5a6475; background:#1c2029; }
  .tag { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px;
         border-radius:4px; color:#111; margin-right:6px; }
  .imgs { display:flex; gap:6px; margin-top:8px; }
  .imgs figure { margin:0; flex:1; min-width:0; }
  .imgs img { width:100%; border-radius:4px; display:block; }
  .imgs figcaption { font-size:11px; color:var(--dim); }
  .lbl { position:absolute; transform:translate(-50%,-100%); pointer-events:none; font-size:12px; font-weight:600;
         padding:2px 6px; border-radius:4px; color:#111; white-space:nowrap; }
  .empty { color:var(--dim); }
  @media (max-width: 800px) { body { grid-template-columns:1fr; grid-template-rows:55vh 45vh; }
    aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="view"></div>
<aside>
  <h1>What changed</h1>
  <div class="sub" id="title"></div>
  <div class="legend">
    <span><i class="sw" style="background:var(--removed)"></i>removed</span>
    <span><i class="sw" style="background:var(--added)"></i>added</span>
    <span><i class="sw" style="background:var(--moved-a)"></i>moved: before</span>
    <span><i class="sw" style="background:var(--moved-b)"></i>moved: after</span>
    <span><i class="sw" style="background:#8a5cc8"></i>seen in only one video</span>
  </div>
  <div class="ctl">
    <label><input type="checkbox" id="photo" checked> photo colours</label>
    <label><input type="checkbox" id="unobs" checked> show unverifiable</label>
    <label><input type="checkbox" id="cams" checked> camera paths</label>
  </div>
  <div id="list"></div>
</aside>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const DATA = /*DATA*/null;
const U = DATA.unit || 1;  // ~1 for a room seen from 2-3 m, smaller for a tabletop
const f32 = b => new Float32Array(Uint8Array.from(atob(b), c => c.charCodeAt(0)).buffer);
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
// reconstruction uses OpenCV camera axes (y down, z forward); flip to y up for display
const flip = p => { for (let i = 0; i < p.length; i += 3) { p[i+1] = -p[i+1]; p[i+2] = -p[i+2]; } return p; };
const V = a => new THREE.Vector3(a[0], -a[1], -a[2]);

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

document.getElementById("title").textContent = DATA.title;

// background cloud
const bgP = flip(f32(DATA.bg.pts)), bgRGB = u8(DATA.bg.col), bgS = u8(DATA.bg.state);
const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute("position", new THREE.BufferAttribute(bgP, 3));
const bgCol = new Float32Array(bgP.length);
bgGeo.setAttribute("color", new THREE.BufferAttribute(bgCol, 3));
const bg = new THREE.Points(bgGeo, new THREE.PointsMaterial({ size: 0.006 * U, vertexColors: true }));
scene.add(bg);
function paintBg() {
  const photo = document.getElementById("photo").checked, unobs = document.getElementById("unobs").checked;
  const pos = bgGeo.attributes.position.array;
  for (let i = 0; i < DATA.bg.n; i++) {
    const s = bgS[i];  // 0 unobserved in other video, 1 confirmed unchanged, 2 changed but too small
    let r = bgRGB[3*i]/255, g = bgRGB[3*i+1]/255, b = bgRGB[3*i+2]/255;
    if (!photo) { const l = 0.35 + 0.3 * (0.3*r + 0.6*g + 0.1*b); r = g = b = l; }
    if (s === 0) { r = 0.5*r + 0.27; g = 0.5*g + 0.18; b = 0.5*b + 0.39; }
    bgCol[3*i] = r; bgCol[3*i+1] = g; bgCol[3*i+2] = b;
    pos[3*i] = (s === 0 && !unobs) ? NaN : bgP[3*i];
  }
  bgGeo.attributes.color.needsUpdate = true; bgGeo.attributes.position.needsUpdate = true;
}
paintBg();

// camera paths
const camGroup = new THREE.Group(); scene.add(camGroup);
for (const c of DATA.cams) {
  const col = c.name === "before" ? 0xe0a050 : 0x50a0e0;
  const pts = c.pos.map(V);
  camGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: col })));
  for (const p of pts) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.012 * U), new THREE.MeshBasicMaterial({ color: col })); m.position.copy(p); camGroup.add(m); }
}

// changes
const css = { removed: "var(--removed)", added: "var(--added)", before: "var(--moved-a)", after: "var(--moved-b)" };
const labels = [], cards = [], centers = [];
const list = document.getElementById("list");
if (!DATA.changes.length) list.innerHTML = '<p class="empty">No changes detected.</p>';
for (const c of DATA.changes) {
  const boxes = [];
  for (const o of c.objects) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(flip(f32(o.pts)), 3));
    const col = new THREE.Color(o.color[0]/255, o.color[1]/255, o.color[2]/255);
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.01 * U, color: col })));
    const box = new THREE.Box3().setFromPoints([V(o.min), V(o.max)]);
    scene.add(new THREE.Box3Helper(box, col));
    boxes.push(box);
    const el = document.createElement("div");
    el.className = "lbl"; el.textContent = `${c.id}. ${c.label}`;
    el.style.background = c.type === "moved" ? css[o.role] : css[c.type];
    view.appendChild(el);
    labels.push({ el, at: new THREE.Vector3((box.min.x+box.max.x)/2, box.max.y, (box.min.z+box.max.z)/2) });
  }
  if (c.type === "moved") {
    const a = boxes[0].getCenter(new THREE.Vector3()), b = boxes[1].getCenter(new THREE.Vector3());
    const d = b.clone().sub(a);
    scene.add(new THREE.ArrowHelper(d.clone().normalize(), a, d.length(), 0xffffff, 0.04 * U, 0.025 * U));
  }
  const all = boxes.reduce((u, b) => u.union(b), new THREE.Box3());
  centers.push(all);
  const card = document.createElement("div");
  card.className = "card";
  const tagCol = c.type === "moved" ? "var(--moved-b)" : css[c.type];
  card.innerHTML = `<div><span class="tag" style="background:${tagCol}">${c.type}</span><b>${c.id}. ${c.label}</b></div>
    <div>${c.text}</div><div class="imgs">${c.images.map(i =>
      `<figure><img src="data:image/jpeg;base64,${i.jpg}" alt="${c.label} ${i.role}"><figcaption>${i.role}</figcaption></figure>`).join("")}</div>`;
  card.onclick = () => focus(cards.indexOf(card));
  list.appendChild(card); cards.push(card);
}
function focus(k) {
  cards.forEach((c, i) => c.classList.toggle("on", i === k));
  const b = centers[k], ctr = b.getCenter(new THREE.Vector3());
  const r = Math.max(b.getSize(new THREE.Vector3()).length(), 0.25 * U);
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(ctr); camera.position.copy(ctr.clone().add(dir.multiplyScalar(r * 2.2)));
}

// start behind the first camera, looking at the middle of the cloud
const sceneBox = new THREE.Box3().setFromBufferAttribute(new THREE.BufferAttribute(bgP, 3));
const mid = sceneBox.getCenter(new THREE.Vector3());
const c0 = V(DATA.cams[0].pos[0]);
controls.target.copy(mid);
camera.position.copy(c0.clone().add(c0.clone().sub(mid).multiplyScalar(0.6)).add(new THREE.Vector3(0, 0.3 * U, 0)));

for (const id of ["photo", "unobs"]) document.getElementById(id).onchange = paintBg;
document.getElementById("cams").onchange = e => camGroup.visible = e.target.checked;

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
const v = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  controls.update(); renderer.render(scene, camera);
  const w = view.clientWidth, h = view.clientHeight;
  for (const l of labels) {
    v.copy(l.at).project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    l.el.style.display = vis ? "" : "none";
    l.el.style.left = `${(v.x + 1) / 2 * w}px`; l.el.style.top = `${(1 - v.y) / 2 * h - 4}px`;
  }
});
</script>
</body>
</html>
